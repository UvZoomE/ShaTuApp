name: Run Maven Tests

on:
  pull_request:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Jave Setup (V21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run All Tests
        run: mvn --batch-mode --no-transfer-progress clean test
